<script>

  document.documentElement.setAttribute('data-theme', _t);

<style>
/* =========================================================================
   知枢 · 数独 —— 样式
   纸张底色 + 朱砂强调色；标题用衬线，正文用系统无衬线
   ========================================================================= */

:root {
  --bg: #f6f2e9;
  --bg-2: #efe9dc;
  --panel: #fffdf8;
  --panel-2: #faf6ec;
  --ink: #1b1a17;
  --muted: #6f6a60;
  --faint: #98917f;
  --line: #ddd5c7;
  --line-2: #c9c1b3;
  --accent: #b23a2e;
  --accent-soft: #f6ded8;
  --accent-2: #0f6b5f;
  --accent-2-soft: #d9ece7;
  --gold: #a8752a;
  --ok: #2f7d4f;
  --bad: #b23a2e;
  --board-line: #c9c1b3;
  --board-thick: #8d8577;
  --shadow: 0 1px 2px rgba(40, 34, 24, .05), 0 10px 30px rgba(40, 34, 24, .06);
  --radius: 14px;
}

[data-theme="dark"] {
  --bg: #15140f;
  --bg-2: #1a1812;
  --panel: #1d1b15;
  --panel-2: #232017;
  --ink: #ece6d9;
  --muted: #a29a89;
  --faint: #7d7667;
  --line: #3a362c;
  --line-2: #4a4538;
  --accent: #e0684f;
  --accent-soft: #3a241f;
  --accent-2: #4fb3a3;
  --accent-2-soft: #1e3a35;
  --gold: #d8a85a;
  --ok: #6fbf8f;
  --bad: #e0684f;
  --board-line: #4a4538;
  --board-thick: #8a8272;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent-soft); color: var(--ink); }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--accent-2); }

button, input, select, textarea { font: inherit; color: inherit; }

button { cursor: pointer; }

.skip {
  position: fixed; left: 8px; top: -60px; z-index: 200;
  background: var(--panel); border: 1px solid var(--line);
  padding: 8px 14px; border-radius: 8px; transition: top .2s;
}
.skip:focus { top: 8px; }

/* ---------- 布局 ---------- */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 272px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  z-index: 50;
  transition: transform .25s ease;
}

.brand { padding: 22px 22px 10px; }
.brand a { color: inherit; text-decoration: none; display: block; }
.brand-kicker {
  font-size: 11px; letter-spacing: .16em; color: var(--muted);
  text-transform: uppercase; margin-bottom: 2px;
}
.brand h1 {
  font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
  font-size: 21px; font-weight: 600; letter-spacing: .02em;
  margin: 0; line-height: 1.3;
}
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

.progress-block { padding: 8px 22px 14px; display: flex; align-items: center; gap: 12px; }
.progress-ring { width: 46px; height: 46px; flex: none; position: relative; }
.progress-ring svg { width: 100%; height: 100%; }
.progress-ring .ring-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: var(--muted);
}
.progress-meta { font-size: 12px; color: var(--muted); line-height: 1.5; }
.progress-meta b { color: var(--ink); font-weight: 600; }

#nav-search {
  margin: 4px 16px 10px; padding: 8px 11px; width: calc(100% - 32px);
  border: 1px solid var(--line); border-radius: 9px;
  background: var(--panel-2); font-size: 13px;
}
#nav-search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.nav { flex: 1; overflow-y: auto; padding: 2px 10px 24px; }
.nav-group {
  margin: 16px 8px 6px; font-size: 10.5px; letter-spacing: .14em;
  color: var(--faint); text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 9px;
  color: var(--ink); text-decoration: none;
  font-size: 13.5px; line-height: 1.4;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.nav-num {
  width: 22px; flex: none; text-align: right; font-variant-numeric: tabular-nums;
  font-size: 11px; color: var(--faint);
}
.nav-item.active .nav-num { color: var(--accent); }
.nav-title { flex: 1; }
.nav-done { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; opacity: .0; }
.nav-item.done .nav-done { opacity: .9; }

.main { margin-left: 272px; min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 26px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.crumb { font-size: 12.5px; color: var(--muted); flex: 1; letter-spacing: .02em; }
.crumb b { color: var(--ink); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); display: inline-flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-2); }
.topbar .menu-btn { display: none; }

.view { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 30px 40px 90px; }

footer.site {
  border-top: 1px solid var(--line);
  padding: 22px 40px 34px; font-size: 12.5px; color: var(--muted);
}
footer.site a { color: var(--muted); }
footer.site a:hover { color: var(--accent); }

/* ---------- 通用组件 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 7px 15px;
  border: 1px solid var(--line-2); border-radius: 9px;
  background: var(--panel); color: var(--ink);
  font-size: 13.5px; text-decoration: none; line-height: 1.2;
  transition: transform .06s ease, border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff7f2; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2);
  font-size: 11.5px; color: var(--muted); line-height: 1.8;
  text-decoration: none;
}
.chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); background: var(--accent-soft); }
.chip.teal { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); background: var(--accent-2-soft); }
.chip.gold { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }

.difficulty { letter-spacing: .08em; color: var(--gold); font-size: 12px; }
.difficulty .off { color: var(--line-2); }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px;
}

.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }

hr.rule { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

/* ---------- 首页 ---------- */
.hero { padding: 26px 0 12px; }
.hero-kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.hero h1 {
  font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
  font-size: clamp(30px, 4.6vw, 52px); line-height: 1.18; font-weight: 600;
  margin: 0 0 14px; letter-spacing: -.015em;
}
.hero p.lead { font-size: 16.5px; color: var(--muted); max-width: 660px; margin: 0 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-note { margin-top: 14px; font-size: 12.5px; color: var(--faint); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 26px 0 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat b { display: block; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 24px; font-weight: 600; line-height: 1.3; }
.stat span { font-size: 12px; color: var(--muted); }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 38px 0 16px; }
.section-head h2 { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 24px; margin: 0; font-weight: 600; }
.section-head .small { color: var(--muted); }

.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 12px; }
.chapter-card {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 15px 16px; color: inherit; text-decoration: none;
  transition: border-color .15s, transform .12s, box-shadow .15s;
  min-height: 118px;
}
.chapter-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); color: inherit; }
.chapter-card .num { font-size: 11px; color: var(--faint); letter-spacing: .12em; display: flex; justify-content: space-between; }
.chapter-card h3 { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 17px; margin: 2px 0 0; font-weight: 600; }
.chapter-card p { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.55; flex: 1; }
.chapter-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--faint); }
.chapter-card.done { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.chapter-card.done .num::after { content: "已学"; color: var(--ok); letter-spacing: .05em; }

.path-lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.lane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.lane h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.lane ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.8; color: var(--ink); }
.lane ul li a { color: inherit; text-decoration: none; }
.lane ul li a:hover { color: var(--accent); }

.note-strip {
  margin: 26px 0 0; padding: 14px 18px; border-left: 3px solid var(--accent);
  background: var(--panel-2); border-radius: 0 10px 10px 0; font-size: 13.5px; color: var(--muted);
}

/* ---------- 课程页 ---------- */
.lesson-head { padding: 4px 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.lesson-kicker { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.lesson-head h1 {
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: clamp(26px, 3.4vw, 38px); font-weight: 600; line-height: 1.28;
  margin: 8px 0 6px; letter-spacing: -.01em;
}
.lesson-sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.lesson-section-title { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 22px; font-weight: 600; margin: 34px 0 10px; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.goal-box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 18px; margin: 0 0 14px;
}
.goal-box h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .12em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.goal-box ul { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.8; }

.core-box {
  border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
  background: var(--accent-soft);
  border-radius: 12px; padding: 12px 18px; margin: 0 0 26px;
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 16.5px; line-height: 1.7; color: var(--ink);
}
.core-box .label { font-size: 10.5px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; display: block; margin-bottom: 2px; font-family: system-ui, sans-serif; }

.lesson-body { font-size: 15.5px; }
.lesson-body h2 {
  font-family: "Noto Serif SC", "Songti SC", serif;
  font-size: 22px; font-weight: 600; margin: 32px 0 10px; line-height: 1.45;
}
.lesson-body h2::before {
  content: ""; display: inline-block; width: 4px; height: 15px;
  background: var(--accent); margin-right: 9px; vertical-align: 2px; border-radius: 2px;
}
.lesson-body h3 { font-size: 16.5px; margin: 22px 0 6px; font-weight: 600; }
.lesson-body p { margin: 0 0 12px; }
.lesson-body ul, .lesson-body ol { margin: 0 0 14px; padding-left: 23px; }
.lesson-body li { margin: 4px 0; }
.lesson-body b, strong { font-weight: 600; }
.lesson-body table {
  width: 100%; border-collapse: collapse; margin: 14px 0 18px;
  font-size: 13.5px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; display: table;
}
.lesson-body th, .lesson-body td { border-bottom: 1px solid var(--line); padding: 8px 11px; text-align: left; vertical-align: top; }
.lesson-body th { background: var(--panel-2); font-weight: 600; font-size: 12.5px; color: var(--muted); }
.lesson-body tr:last-child td { border-bottom: 0; }
.lesson-body .formula { text-align: center; margin: 12px 0; font-family: "Latin Modern Math", Georgia, serif; }
.lesson-body pre.code, .code {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 15px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.65; color: var(--ink);
}
.lesson-body .note {
  background: var(--panel-2); border-left: 3px solid var(--accent-2);
  border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 13.5px; color: var(--muted); margin: 14px 0;
}
.lesson-body .example {
  background: var(--panel); border: 1px dashed var(--line-2); border-radius: 10px;
  padding: 12px 16px; margin: 14px 0;
}
.lesson-body .example .tag { font-size: 10.5px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }

.note-layout {
  width: 150px; height: 150px; margin: 12px 0;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel);
  font-size: 12px; color: var(--muted);
}
.note-layout span { display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.note-layout span:nth-child(3n) { border-right: 0; }
.note-layout span:nth-child(n+7) { border-bottom: 0; }

.schematic { max-width: 340px; margin: 16px 0 6px; }
.schematic svg { width: 100%; height: auto; display: block; }
.schematic-caption { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

/* ---------- 小盘面 / 大盘面 ---------- */
.mini-board-wrap { margin: 18px 0 8px; }
.mini-board, .board {
  display: grid; grid-template-columns: repeat(9, 1fr);
  width: 100%; aspect-ratio: 1 / 1;
  background: var(--panel);
  border: 3px solid var(--board-thick);
  border-radius: 5px; overflow: hidden;
  container-type: inline-size;
}
.mini-board { max-width: 430px; }
.board { max-width: 520px; }

.cell {
  position: relative; min-width: 0; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  appearance: none; border: 0; border-right: 1px solid var(--board-line);
  border-bottom: 1px solid var(--board-line);
  background: transparent; padding: 0;
  color: var(--ink); font-family: inherit;
}
.cell.br { border-right: 3px solid var(--board-thick); }
.cell.bb { border-bottom: 3px solid var(--board-thick); }
.cell .val { font-size: 5.4cqi; line-height: 1; font-variant-numeric: tabular-nums; }
.cell.given .val { font-weight: 600; }
.cell.user .val { color: var(--accent-2); font-weight: 500; }
.cell.focus { background: var(--accent-soft); }
.cell.unit { background: var(--accent-2-soft); }
.cell.same { background: color-mix(in srgb, var(--gold) 18%, var(--panel)); }
.cell.conflict .val, .cell.wrong .val { color: var(--bad); }
.cell.conflict { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.cell.pending { background: color-mix(in srgb, var(--ok) 14%, var(--panel)); }
.cell.pending .pending-val {
  position: absolute; font-size: 5.4cqi; color: var(--ok); opacity: .75; font-weight: 600;
}
.cell.elim-cell { background: color-mix(in srgb, var(--bad) 7%, var(--panel)); }

.cell .notes {
  position: absolute; inset: 2px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  font-size: 2.1cqi; line-height: 1; color: var(--faint);
}
.cell .notes span { display: flex; align-items: center; justify-content: center; }
.cell .notes span.hit { color: var(--accent); font-weight: 700; }
.cell .notes span.elim { color: var(--bad); text-decoration: line-through; font-weight: 700; }
.cell .notes span.dim { color: transparent; }

.cell.practice { cursor: pointer; }
.cell.practice:hover { background: var(--panel-2); }
.cell.selected { outline: 2px solid var(--accent); outline-offset: -3px; background: var(--accent-soft); }
.cell.selected .val { font-weight: 700; }
.mini-board .cell { cursor: default; }
.mini-caption { font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.6; }

/* ---------- 技巧演示 ---------- */
.demo {
  margin: 22px 0 10px; padding: 16px 16px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
}
.demo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.demo-head h4 { margin: 0; font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.demo-badge { font-size: 11px; color: var(--accent); }
.demo-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(210px, 260px); gap: 18px; align-items: start; }
.demo-board { max-width: 420px; }
.demo-side { font-size: 13px; }
.demo-step-title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.demo-step-text { color: var(--muted); font-size: 12.5px; line-height: 1.65; min-height: 5.2em; }
.demo-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.demo-progress { font-size: 11px; color: var(--faint); margin-top: 8px; }
.demo-caption { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

/* ---------- 误解 / 深度推导 ---------- */
.misconceptions { margin: 30px 0 8px; }
.misconceptions h2, .anchors h2, .sources h2 {
  font-family: "Noto Serif SC", "Songti SC", serif; font-size: 20px; margin: 0 0 10px; font-weight: 600;
}
.mis-item {
  display: grid; grid-template-columns: 28px 1fr; gap: 8px;
  padding: 10px 0; border-bottom: 1px dashed var(--line);
  font-size: 13.5px;
}
.mis-item:last-child { border-bottom: 0; }
.mis-item .x { color: var(--bad); font-weight: 700; }
.mis-item b { color: var(--muted); font-weight: 600; }
.mis-item .right { color: var(--ink); }

details.depth {
  margin: 26px 0 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
}
details.depth summary {
  cursor: pointer; padding: 13px 17px; font-size: 13.5px; font-weight: 600;
  list-style: none; display: flex; align-items: center; gap: 8px;
}
details.depth summary::-webkit-details-marker { display: none; }
details.depth summary::before { content: "▸"; color: var(--accent); transition: transform .2s; }
details.depth[open] summary::before { transform: rotate(90deg); }
details.depth .depth-body { padding: 0 18px 16px; font-size: 14.5px; border-top: 1px solid var(--line); }
details.depth .depth-body h3 { margin-top: 16px; }

.anchors { margin: 26px 0 8px; padding: 14px 18px; background: var(--panel-2); border-radius: 12px; }
.anchors ul { margin: 0; padding-left: 20px; font-size: 13.5px; }
.sources { margin: 24px 0 0; font-size: 12px; color: var(--muted); }
.sources ul { margin: 4px 0 0; padding-left: 18px; }

.lesson-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }

/* ---------- 测验 ---------- */
.quizzes { margin: 32px 0 8px; }
.quizzes h2 { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 20px; margin: 0 0 10px; font-weight: 600; }
.quiz { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 14px 16px; margin: 0 0 12px; }
.quiz-q { font-size: 14px; margin: 0 0 10px; line-height: 1.7; }
.quiz-opts { display: grid; gap: 6px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 13.5px; line-height: 1.55; cursor: pointer;
  background: var(--panel-2);
}
.quiz-opt:hover { border-color: var(--line-2); }
.quiz-opt input { margin-top: 3px; accent-color: var(--accent); }
.quiz-opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.quiz-opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.quiz-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.quiz-feedback { font-size: 12.5px; }
.quiz-feedback.ok { color: var(--ok); }
.quiz-feedback.bad { color: var(--bad); }
.quiz-explain {
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
  font-size: 12.5px; color: var(--muted); line-height: 1.7;
}
.quiz-remedy { margin-top: 8px; font-size: 12.5px; line-height: 1.8; }
.quiz-remedy a { font-weight: 600; }
.mis-card {
  margin-top: 8px; padding: 9px 12px; border-radius: 9px;
  background: color-mix(in srgb, var(--bad) 8%, var(--panel)); font-size: 12.5px; line-height: 1.7;
}

/* ---------- 练习场 ---------- */
.practice-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 26px; align-items: start; }
.practice-main { min-width: 0; }
.practice-board-wrap { position: relative; }
.practice-side { display: flex; flex-direction: column; gap: 12px; }
.practice-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.practice-head h1 { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 27px; margin: 0; font-weight: 600; flex: 1; }
.diff-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.diff-tabs button {
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); font-size: 12px; color: var(--muted);
}
.diff-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff7f2; }

.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 10px; }
.pad button {
  min-height: 46px; border: 1px solid var(--line-2); border-radius: 9px;
  background: var(--panel); font-size: 17px; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center;
}
.pad button:hover { border-color: var(--accent); }
.pad button.wide { grid-column: span 2; font-size: 12.5px; }
.pad button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.practice-info { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.hint-box { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 10px 12px; font-size: 12.5px; line-height: 1.7; }
.hint-box b { color: var(--accent); }
.hint-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 100;
  max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 诊断 ---------- */
.diag-wrap { max-width: 760px; }
.diag-controls { display: flex; align-items: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
.diag-stage .quiz { border-color: var(--line-2); }
.diag-result { margin-top: 18px; font-size: 13.5px; }
.diag-result h3 { font-size: 15px; margin: 0 0 8px; }
.diag-remedy-item { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.diag-score { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 26px; font-weight: 600; margin: 6px 0; }

/* ---------- 实验室 ---------- */
.lab-tabs { display: flex; gap: 6px; margin: 10px 0 18px; }
.lab-tabs button { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
.lab-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff7f2; }
.lab-input { width: 100%; min-height: 96px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.6; resize: vertical; }
.lab-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
.lab-result { margin-top: 16px; }
.lab-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.lab-log { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lab-log-item { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; display: grid; grid-template-columns: 34px 1fr; gap: 8px; }
.lab-log-item:last-child { border-bottom: 0; }
.lab-log-item .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.lab-log-item b { color: var(--accent); font-weight: 600; }
.lab-warn { padding: 10px 13px; border-radius: 9px; background: color-mix(in srgb, var(--bad) 9%, var(--panel)); font-size: 13px; margin: 10px 0; }
.lab-ok { padding: 10px 13px; border-radius: 9px; background: color-mix(in srgb, var(--ok) 9%, var(--panel)); font-size: 13px; margin: 10px 0; }

/* ---------- 速查 / 术语 / 卡片 ---------- */
.filter-input {
  width: 100%; max-width: 380px; padding: 10px 13px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel); font-size: 14px; margin: 8px 0 18px;
}
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.tech-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
.tech-table th, .tech-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tech-table th { background: var(--panel-2); font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; }
.tech-table tr:last-child td { border-bottom: 0; }
.tech-table td a { font-weight: 600; text-decoration: none; }

.glossary-list { margin: 0; padding: 0; list-style: none; }
.glossary-item { padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; display: flex; gap: 12px; }
.glossary-item b { min-width: 92px; flex: none; font-weight: 600; }
.glossary-item .ref { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; }

.card-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 20px; }
.card-stage { perspective: 1200px; max-width: 520px; margin: 0 auto; }
.flashcard { width: 100%; height: 260px; position: relative; cursor: pointer; }
.fc-inner { position: absolute; inset: 0; transition: transform .5s; transform-style: preserve-3d; }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
  padding: 24px; display: flex; flex-direction: column; justify-content: center;
  box-shadow: var(--shadow);
}
.fc-front { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 20px; line-height: 1.6; }
.fc-back { transform: rotateY(180deg); font-size: 14.5px; line-height: 1.8; color: var(--muted); }
.fc-label { font-size: 10.5px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin-bottom: 10px; }
.card-actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.card-counts { font-size: 12.5px; color: var(--muted); }

/* ---------- 详情 / 响应式 ---------- */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

@media (max-width: 1000px) {
  .view { padding: 24px 24px 80px; }
  .practice-layout { grid-template-columns: 1fr; }
  .practice-side { max-width: 520px; }
  .path-lanes { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar .menu-btn { display: inline-flex; }
  .topbar { padding: 0 14px; }
  .view { padding: 18px 16px 70px; }
  .demo-layout { grid-template-columns: 1fr; }
  .hero h1 { font-size: 30px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .stats-row .stat:last-child { grid-column: span 2; }
  .lesson-head h1 { font-size: 26px; }
  .lesson-body { font-size: 15px; }
  .board { max-width: none; }
  .chapter-grid { grid-template-columns: 1fr; }
  .path-lanes { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .lesson-body table { font-size: 12.5px; }
  .quiz-opt { font-size: 13px; }
  .practice-head h1 { font-size: 22px; }
  .pad { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pad button { min-height: 48px; }
  .demo-controls .btn { flex: 1 1 auto; }
}

#scrim {
  position: fixed; inset: 0; background: rgba(20, 18, 12, .42);
  opacity: 0; pointer-events: none; transition: .2s; z-index: 45;
}
#scrim.show { opacity: 1; pointer-events: auto; }

@media print {
  .sidebar, .topbar, .lesson-nav, .demo-controls, footer.site { display: none !important; }
  .main { margin: 0; }
  .view { max-width: none; padding: 0; }
  body { background: #fff; color: #000; font-size: 12pt; }
}

/* 阅读列：正文控制在适合长文阅读的宽度，演示区可更宽 */
.lesson-head, .goal-box, .core-box, .lesson-body, .misconceptions,
.quizzes, .anchors, .sources, .lesson-nav, .lesson-section-title {
  max-width: 840px;
}

</style>

<body>
<div id="app">
  <aside id="sidebar" class="sidebar" aria-label="课程目录"></aside>
  <div id="scrim" class="scrim"></div>
  <main class="main">
    <header id="topbar" class="topbar"></header>
    <div id="view" class="view"></div>
    <footer class="site">
      <span>知枢学习系统 · 数独：从规则到链</span>
      <span>内容与求解器均为本机生成；进度存在浏览器本地。</span>
    </footer>
  </main>
</div>
<script>
/* =========================================================================
 * 数独引擎 · SudokuEngine
 * -------------------------------------------------------------------------
 * 供「知枢 · 数独」使用。所有技巧检测器都只在候选数集合上做逻辑推理：
 *   1. 唯一余数 / 隐性唯一
 *   2. 区块排除（指向 / 声明）
 *   3. 显性数组 / 隐性数组（数对、三数组、四数组）
 *   4. X-Wing / Swordfish / Jellyfish
 *   5. XY-Wing / XYZ-Wing
 *   6. 唯一矩形（依赖唯一解假设）
 *   7. 单数染色 / 交替推理链 AIC
 * 求解器用位运算 + MRV 回溯，唯一解校验最多数到 2 个解就停。
 *
 * 该文件同时支持浏览器（window.SudokuEngine）与 Node（module.exports）。
 * ========================================================================= */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SudokuEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ALL = 0x3FE;                    // 二进制 1111111110，位 1..9
  const POP = new Uint8Array(1024);
  for (let i = 1; i < 1024; i++) POP[i] = POP[i >> 1] + (i & 1);

  const bit = (d) => 1 << d;
  const DIGITS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

  function bitsOf(mask) {
    const out = [];
    for (let d = 1; d <= 9; d++) if (mask & bit(d)) out.push(d);
    return out;
  }
  function lowestDigit(mask) {
    for (let d = 1; d <= 9; d++) if (mask & bit(d)) return d;
    return 0;
  }

  const ROWS = [], COLS = [], BOXES = [], UNITS = [], UNIT_OF = [];
  for (let r = 0; r < 9; r++) {
    const cells = [];
    for (let c = 0; c < 9; c++) cells.push(r * 9 + c);
    ROWS.push(cells);
  }
  for (let c = 0; c < 9; c++) {
    const cells = [];
    for (let r = 0; r < 9; r++) cells.push(r * 9 + c);
    COLS.push(cells);
  }
  for (let br = 0; br < 3; br++) {
    for (let bc = 0; bc < 3; bc++) {
      const cells = [];
      for (let r = br * 3; r < br * 3 + 3; r++)
        for (let c = bc * 3; c < bc * 3 + 3; c++) cells.push(r * 9 + c);
      BOXES.push(cells);
    }
  }
  // 教学顺序：先宫，再行、列。隐性唯一按这个顺序找更符合人的扫描习惯。
  BOXES.forEach((cells, i) => UNITS.push({ type: 'box', index: i, cells }));
  ROWS.forEach((cells, i) => UNITS.push({ type: 'row', index: i, cells }));
  COLS.forEach((cells, i) => UNITS.push({ type: 'col', index: i, cells }));

  const PEERS = [];
  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
    const set = new Set();
    ROWS[r].forEach((x) => x !== i && set.add(x));
    COLS[c].forEach((x) => x !== i && set.add(x));
    BOXES[b].forEach((x) => x !== i && set.add(x));
    PEERS.push(Array.from(set));
  }
  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9;
    UNIT_OF[i] = {
      row: r, col: c,
      box: Math.floor(r / 3) * 3 + Math.floor(c / 3),
    };
  }

  function cellName(i) { return 'R' + (Math.floor(i / 9) + 1) + 'C' + (i % 9 + 1); }
  function unitName(u) {
    if (!u) return '';
    if (u.type === 'row') return '第 ' + (u.index + 1) + ' 行';
    if (u.type === 'col') return '第 ' + (u.index + 1) + ' 列';
    return '第 ' + (u.index + 1) + ' 宫';
  }
  function unitTypeName(t) {
    return t === 'row' ? '行' : t === 'col' ? '列' : '宫';
  }

  function parse(text) {
    const cleaned = String(text || '').replace(/[^0-9.]/g, '');
    if (cleaned.length !== 81) throw new Error('需要 81 个字符（0 或 . 表示空格），当前 ' + cleaned.length);
    const g = new Uint8Array(81);
    for (let i = 0; i < 81; i++) g[i] = cleaned[i] === '.' ? 0 : (Number(cleaned[i]) || 0);
    return g;
  }
  function format(grid, empty) {
    empty = empty === undefined ? '.' : empty;
    let s = '';
    for (let i = 0; i < 81; i++) s += grid[i] ? String(grid[i]) : empty;
    return s;
  }
  function cloneGrid(grid) { return new Uint8Array(grid); }

  function candidates(grid) {
    const rowMask = new Uint16Array(9), colMask = new Uint16Array(9), boxMask = new Uint16Array(9);
    for (let i = 0; i < 81; i++) {
      const v = grid[i];
      if (!v) continue;
      const r = Math.floor(i / 9), c = i % 9, b = UNIT_OF[i].box;
      rowMask[r] |= bit(v); colMask[c] |= bit(v); boxMask[b] |= bit(v);
    }
    const cand = new Uint16Array(81);
    for (let i = 0; i < 81; i++) {
      if (grid[i]) continue;
      const r = Math.floor(i / 9), c = i % 9, b = UNIT_OF[i].box;
      cand[i] = ALL & ~(rowMask[r] | colMask[c] | boxMask[b]);
    }
    return cand;
  }

  function initialState(grid) {
    const g = cloneGrid(grid);
    return { grid: g, cand: candidates(g) };
  }

  function isSolved(grid) {
    for (let i = 0; i < 81; i++) if (!grid[i]) return false;
    return isValid(grid);
  }

  function isValid(grid) {
    for (const unit of UNITS) {
      const seen = new Uint16Array(10);
      for (const c of unit.cells) {
        const v = grid[c];
        if (!v) continue;
        if (seen[v]) return false;
        seen[v] = 1;
      }
    }
    return true;
  }

  function applyStep(state, step) {
    let contradiction = false;
    if (step.placements) {
      for (const p of step.placements) {
        const d = p.digit;
        state.grid[p.cell] = d;
        state.cand[p.cell] = 0;
        for (const q of PEERS[p.cell]) state.cand[q] &= ~bit(d);
      }
    }
    if (step.eliminations) {
      for (const e of step.eliminations) {
        state.cand[e.cell] &= ~bit(e.digit);
        if (state.grid[e.cell] === 0 && state.cand[e.cell] === 0) contradiction = true;
      }
    }
    return contradiction;
  }

  function makeStep(tech, level, data) {
    return Object.assign({
      tech, level,
      placements: [], eliminations: [],
      focus: [], digits: [], unit: null,
    }, data);
  }

  /* -----------------------------------------------------------------------
   * 技巧 1：唯一余数
   * --------------------------------------------------------------------- */
  function nakedSingle(state) {
    for (let i = 0; i < 81; i++) {
      if (state.grid[i]) continue;
      if (POP[state.cand[i]] === 1) {
        const d = lowestDigit(state.cand[i]);
        return makeStep('naked-single', 1, {
          placements: [{ cell: i, digit: d }],
          focus: [i], digits: [d],
          title: '唯一余数',
          text: cellName(i) + ' 的候选只剩 ' + d + '。同行、同列、同宫已经把另外 8 个数字全排掉了，这里只能填 ' + d + '。',
        });
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 2：隐性唯一
   * --------------------------------------------------------------------- */
  function hiddenSingle(state, minLevel) {
    for (const unit of UNITS) {
      for (const d of DIGITS) {
        // 单元里已经有 d 就跳过
        let has = false;
        for (const c of unit.cells) if (state.grid[c] === d) { has = true; break; }
        if (has) continue;
        const pos = [];
        for (const c of unit.cells) {
          if (!state.grid[c] && (state.cand[c] & bit(d))) pos.push(c);
        }
        if (pos.length === 1) {
          const cell = pos[0];
          // 只有该格还保留别的候选时，才值得叫“隐性”而不是“唯一余数”
          if (POP[state.cand[cell]] === 1) continue;
          return makeStep('hidden-single', 2, {
            placements: [{ cell, digit: d }],
            focus: [cell], unit, digits: [d],
            title: '隐性唯一',
            text: '在' + unitName(unit) + '里，数字 ' + d + ' 只有一个格子还能放：' + cellName(cell) + '。别的格子要么已填，要么候选里没有 ' + d + '。',
          });
        }
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 3：区块排除
   * --------------------------------------------------------------------- */
  function lockedCandidates(state) {
    // 指向：宫里某数字的候选只落在同一行（或列）
    for (let b = 0; b < 9; b++) {
      const box = BOXES[b];
      for (const d of DIGITS) {
        const pos = [];
        for (const c of box) if (!state.grid[c] && (state.cand[c] & bit(d))) pos.push(c);
        if (pos.length < 2) continue;
        const rows = new Set(pos.map((c) => UNIT_OF[c].row));
        const cols = new Set(pos.map((c) => UNIT_OF[c].col));
        let elims = null, unit = null, lockName = '';
        if (rows.size === 1) {
          const r = pos[0] / 9 | 0;
          unit = { type: 'row', index: r, cells: ROWS[r] };
          lockName = '第 ' + (r + 1) + ' 行';
          elims = [];
          for (const c of ROWS[r]) {
            if (BOXES[b].includes(c)) continue;
            if (!state.grid[c] && (state.cand[c] & bit(d))) elims.push({ cell: c, digit: d });
          }
        } else if (cols.size === 1) {
          const c0 = pos[0] % 9;
          unit = { type: 'col', index: c0, cells: COLS[c0] };
          lockName = '第 ' + (c0 + 1) + ' 列';
          elims = [];
          for (const c of COLS[c0]) {
            if (BOXES[b].includes(c)) continue;
            if (!state.grid[c] && (state.cand[c] & bit(d))) elims.push({ cell: c, digit: d });
          }
        }
        if (elims && elims.length) {
          return makeStep('locked-pointing', 3, {
            eliminations: elims,
            focus: pos.slice(), unit, digits: [d],
            title: '区块排除（指向）',
            text: '第 ' + (b + 1) + ' 宫里，数字 ' + d + ' 的候选只落在' + lockName + '上。宫内的 ' + d + ' 一定在这几个格子里，所以' + lockName + '在宫外的其他格子不可能再放 ' + d + '。',
          });
        }
      }
    }
    // 声明：行/列里某数字的候选只落在同一个宫里
    const lines = ROWS.map((cells, i) => ({ type: 'row', index: i, cells }))
      .concat(COLS.map((cells, i) => ({ type: 'col', index: i, cells })));
    for (const lineObj of lines) {
      const line = lineObj.cells;
      const type = lineObj.type;
      for (const d of DIGITS) {
        let has = false;
        for (const c of line) if (state.grid[c] === d) { has = true; break; }
        if (has) continue;
        const pos = [];
        for (const c of line) if (!state.grid[c] && (state.cand[c] & bit(d))) pos.push(c);
        if (pos.length < 2) continue;
        const boxes = new Set(pos.map((c) => UNIT_OF[c].box));
        if (boxes.size !== 1) continue;
        const b = UNIT_OF[pos[0]].box;
        const elims = [];
        for (const c of BOXES[b]) {
          if (line.includes(c)) continue;
          if (!state.grid[c] && (state.cand[c] & bit(d))) elims.push({ cell: c, digit: d });
        }
        if (elims.length) {
          return makeStep('locked-claiming', 3, {
            eliminations: elims,
            focus: pos.slice(), unit: { type: type, index: type === 'row' ? UNIT_OF[pos[0]].row : UNIT_OF[pos[0]].col, cells: line },
            digits: [d],
            title: '区块排除（声明）',
            text: '在' + unitName({ type, index: type === 'row' ? UNIT_OF[pos[0]].row : UNIT_OF[pos[0]].col }) + '里，数字 ' + d + ' 的候选全部落在第 ' + (b + 1) + ' 宫里。这一行（列）的 ' + d + ' 必须在这个宫内，所以该宫其他格子可以删掉 ' + d + '。',
          });
        }
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 组合工具
   * --------------------------------------------------------------------- */
  function combinations(arr, k, cb) {
    const n = arr.length;
    if (k > n) return;
    const pick = [];
    (function rec(start, depth) {
      if (depth === k) { cb(pick.slice()); return; }
      for (let i = start; i <= n - (k - depth); i++) {
        pick.push(arr[i]);
        rec(i + 1, depth + 1);
        pick.pop();
      }
    })(0, 0);
  }

  /* -----------------------------------------------------------------------
   * 技巧 4：显性数组（数对 / 三数组 / 四数组）
   * --------------------------------------------------------------------- */
  function nakedSubsets(state) {
    for (const unit of UNITS) {
      const empty = unit.cells.filter((c) => !state.grid[c]);
      for (let n = 2; n <= 4; n++) {
        let found = null;
        combinations(empty, n, (combo) => {
          if (found) return;
          let union = 0;
          for (const c of combo) {
            const pc = POP[state.cand[c]];
            if (pc < 2 || pc > n) return;
            union |= state.cand[c];
          }
          if (POP[union] !== n) return;
          const elims = [];
          for (const c of unit.cells) {
            if (combo.indexOf(c) >= 0 || state.grid[c]) continue;
            const hit = state.cand[c] & union;
            for (const d of bitsOf(hit)) elims.push({ cell: c, digit: d });
          }
          if (!elims.length) return;
          found = makeStep('naked-subset', 4, {
            eliminations: elims, focus: combo.slice(),
            unit, digits: bitsOf(union),
            title: '显性' + (n === 2 ? '数对' : n === 3 ? '三数组' : '四数组'),
            text: combo.map(cellName).join('、') + ' 这 ' + n + ' 个格子的候选合起来只有 {' + bitsOf(union).join(', ') + '}。它们必须把这 ' + n + ' 个数字占完，所以' + unitName(unit) + '里其他格子不能再出现这些数字。',
          });
        });
        if (found) return found;
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 5：隐性数组（隐性数对 / 三数组）
   * --------------------------------------------------------------------- */
  function hiddenSubsets(state) {
    for (const unit of UNITS) {
      const empty = unit.cells.filter((c) => !state.grid[c]);
      for (let n = 2; n <= 3; n++) {
        let found = null;
        combinations(DIGITS, n, (digits) => {
          if (found) return;
          const posAll = [];
          const posByDigit = [];
          for (const d of digits) {
            const pos = empty.filter((c) => state.cand[c] & bit(d));
            if (pos.length < 2 || pos.length > n) return;
            posByDigit.push(pos);
            for (const c of pos) if (posAll.indexOf(c) < 0) posAll.push(c);
          }
          if (posAll.length !== n) return;
          const digitMask = digits.reduce((m, d) => m | bit(d), 0);
          const elims = [];
          for (const c of posAll) {
            const extra = state.cand[c] & ~digitMask;
            for (const d of bitsOf(extra)) elims.push({ cell: c, digit: d });
          }
          if (!elims.length) return;
          found = makeStep('hidden-subset', 5, {
            eliminations: elims, focus: posAll.slice(),
            unit, digits: digits.slice(),
            title: '隐性' + (n === 2 ? '数对' : '三数组'),
            text: '在' + unitName(unit) + '里，数字 ' + digits.join('、') + ' 只可能出现在 ' + posAll.map(cellName).join('、') + ' 这 ' + n + ' 个格子里。这 ' + n + ' 个格子被它们占满，其他候选都得删掉。',
          });
        });
        if (found) return found;
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 6：X-Wing
   * --------------------------------------------------------------------- */
  function xWing(state) {
    for (const d of DIGITS) {
      // 行版
      const rowPos = [];
      for (let r = 0; r < 9; r++) {
        const pos = ROWS[r].filter((c) => !state.grid[c] && (state.cand[c] & bit(d)));
        rowPos.push(pos);
      }
      for (let r1 = 0; r1 < 9; r1++) {
        if (rowPos[r1].length !== 2) continue;
        for (let r2 = r1 + 1; r2 < 9; r2++) {
          if (rowPos[r2].length !== 2) continue;
          const c1a = rowPos[r1][0] % 9, c1b = rowPos[r1][1] % 9;
          const c2a = rowPos[r2][0] % 9, c2b = rowPos[r2][1] % 9;
          if (c1a !== c2a || c1b !== c2b) continue;
          const cols = [c1a, c1b];
          const elims = [];
          for (const c of cols) {
            for (let r = 0; r < 9; r++) {
              if (r === r1 || r === r2) continue;
              const cell = r * 9 + c;
              if (!state.grid[cell] && (state.cand[cell] & bit(d))) elims.push({ cell, digit: d });
            }
          }
          if (elims.length) {
            return makeStep('x-wing', 6, {
              eliminations: elims,
              focus: [r1 * 9 + c1a, r1 * 9 + c1b, r2 * 9 + c2a, r2 * 9 + c2b],
              unit: { type: 'row', index: r1, cells: ROWS[r1] },
              digits: [d],
              title: 'X-Wing（交叉排除）',
              text: '数字 ' + d + ' 在第 ' + (r1 + 1) + ' 行和第 ' + (r2 + 1) + ' 行都只剩第 ' + (cols[0] + 1) + '、' + (cols[1] + 1) + ' 列两个位置。两行各放一个 ' + d + '，正好占掉这两列，所以这两列在其他行不能再有 ' + d + '。',
            });
          }
        }
      }
      // 列版
      const colPos = [];
      for (let c = 0; c < 9; c++) {
        const pos = COLS[c].filter((cell) => !state.grid[cell] && (state.cand[cell] & bit(d)));
        colPos.push(pos);
      }
      for (let c1 = 0; c1 < 9; c1++) {
        if (colPos[c1].length !== 2) continue;
        for (let c2 = c1 + 1; c2 < 9; c2++) {
          if (colPos[c2].length !== 2) continue;
          const r1a = Math.floor(colPos[c1][0] / 9), r1b = Math.floor(colPos[c1][1] / 9);
          const r2a = Math.floor(colPos[c2][0] / 9), r2b = Math.floor(colPos[c2][1] / 9);
          if (r1a !== r2a || r1b !== r2b) continue;
          const rows = [r1a, r1b];
          const elims = [];
          for (const r of rows) {
            for (let c = 0; c < 9; c++) {
              if (c === c1 || c === c2) continue;
              const cell = r * 9 + c;
              if (!state.grid[cell] && (state.cand[cell] & bit(d))) elims.push({ cell, digit: d });
            }
          }
          if (elims.length) {
            return makeStep('x-wing', 6, {
              eliminations: elims,
              focus: [r1a * 9 + c1, r1b * 9 + c1, r2a * 9 + c2, r2b * 9 + c2],
              unit: { type: 'col', index: c1, cells: COLS[c1] },
              digits: [d],
              title: 'X-Wing（交叉排除）',
              text: '数字 ' + d + ' 在第 ' + (c1 + 1) + ' 列和第 ' + (c2 + 1) + ' 列都只剩第 ' + (rows[0] + 1) + '、' + (rows[1] + 1) + ' 行两个位置。两列各放一个 ' + d + '，正好占掉这两行，所以这两行在其他列不能再有 ' + d + '。',
            });
          }
        }
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 7：Swordfish / Jellyfish
   * --------------------------------------------------------------------- */
  function fish(state, size, tech, title) {
    for (const d of DIGITS) {
      for (const orient of ['row', 'col']) {
        const lines = orient === 'row' ? ROWS : COLS;
        const crossOf = (cell) => (orient === 'row' ? cell % 9 : Math.floor(cell / 9));
        const lineOf = (cell) => (orient === 'row' ? Math.floor(cell / 9) : cell % 9);
        const posByLine = lines.map((line) => line.filter((c) => !state.grid[c] && (state.cand[c] & bit(d))));
        const candidates = [];
        for (let i = 0; i < 9; i++) if (posByLine[i].length >= 2 && posByLine[i].length <= size) candidates.push(i);
        let found = null;
        combinations(candidates, size, (combo) => {
          if (found) return;
          const crossSet = new Set();
          for (const li of combo) for (const c of posByLine[li]) crossSet.add(crossOf(c));
          if (crossSet.size !== size) return;
          const elims = [];
          for (const cross of crossSet) {
            for (let li = 0; li < 9; li++) {
              if (combo.indexOf(li) >= 0) continue;
              const cell = orient === 'row' ? li * 9 + cross : cross * 9 + li;
              if (!state.grid[cell] && (state.cand[cell] & bit(d))) elims.push({ cell, digit: d });
            }
          }
          if (!elims.length) return;
          const focus = [];
          for (const li of combo) for (const c of posByLine[li]) focus.push(c);
          found = makeStep(tech, size === 3 ? 7 : 8, {
            eliminations: elims, focus,
            unit: { type: orient, index: combo[0], cells: lines[combo[0]] },
            digits: [d],
            title,
            text: '数字 ' + d + ' 在' + (orient === 'row' ? '行' : '列') + ' ' + combo.map((x) => x + 1).join('、') + ' 里的候选全部落在' + (orient === 'row' ? '列' : '行') + ' ' + Array.from(crossSet).map((x) => x + 1).join('、') + ' 上。这 ' + size + ' 个' + (orient === 'row' ? '行' : '列') + '必须各放一个 ' + d + '，正好占满这 ' + size + ' 个' + (orient === 'row' ? '列' : '行') + '，其他' + (orient === 'row' ? '行' : '列') + '可以删掉 ' + d + '。',
          });
        });
        if (found) return found;
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 8：XY-Wing / XYZ-Wing
   * --------------------------------------------------------------------- */
  function sees(a, b) {
    return Math.floor(a / 9) === Math.floor(b / 9) || (a % 9) === (b % 9) ||
      UNIT_OF[a].box === UNIT_OF[b].box;
  }
  function commonPeers(a, b) {
    const out = [];
    for (let i = 0; i < 81; i++) {
      if (i === a || i === b) continue;
      if (sees(i, a) && sees(i, b)) out.push(i);
    }
    return out;
  }

  function xyWing(state) {
    const bivalue = [];
    for (let i = 0; i < 81; i++) if (!state.grid[i] && POP[state.cand[i]] === 2) bivalue.push(i);
    for (const pivot of bivalue) {
      const pb = bitsOf(state.cand[pivot]);
      const a = pb[0], b = pb[1];
      for (const q1 of bivalue) {
        if (q1 === pivot || !sees(pivot, q1)) continue;
        const q1b = bitsOf(state.cand[q1]);
        if (q1b.indexOf(a) < 0) continue;
        const z = q1b[0] === a ? q1b[1] : q1b[0];
        if (z === b) continue;
        for (const q2 of bivalue) {
          if (q2 === pivot || q2 === q1 || !sees(pivot, q2)) continue;
          const q2b = bitsOf(state.cand[q2]);
          if (q2b[0] !== b && q2b[1] !== b) continue;
          if (q2b[0] !== z && q2b[1] !== z) continue;
          const elims = [];
          for (const c of commonPeers(q1, q2)) {
            if (c === pivot) continue;
            if (!state.grid[c] && (state.cand[c] & bit(z))) elims.push({ cell: c, digit: z });
          }
          if (elims.length) {
            return makeStep('xy-wing', 8, {
              eliminations: elims, focus: [pivot, q1, q2], digits: [a, b, z],
              title: 'XY-Wing',
              text: cellName(pivot) + ' 是枢纽，候选 {' + a + ',' + b + '}；' + cellName(q1) + ' 是 {' + a + ',' + z + '}，' + cellName(q2) + ' 是 {' + b + ',' + z + '}，两翼都看得见枢纽。枢纽取 ' + a + ' 时 ' + cellName(q2) + ' 必取 ' + z + '，枢纽取 ' + b + ' 时 ' + cellName(q1) + ' 必取 ' + z + '。两种情况都有人取 ' + z + '，所以同时看见两翼的格子不能取 ' + z + '。',
            });
          }
        }
      }
    }
    return null;
  }

  function xyzWing(state) {
    const tri = [];
    for (let i = 0; i < 81; i++) if (!state.grid[i] && POP[state.cand[i]] === 3) tri.push(i);
    for (const pivot of tri) {
      const pd = bitsOf(state.cand[pivot]);
      for (let x = 0; x < 3; x++) {
        for (let y = 0; y < 3; y++) {
          if (x === y) continue;
          const zIdx = 3 - x - y;
          const X = pd[x], Y = pd[y], Z = pd[zIdx];
          const pincersX = [], pincersY = [];
          for (let i = 0; i < 81; i++) {
            if (i === pivot || state.grid[i] || POP[state.cand[i]] !== 2) continue;
            if (!sees(pivot, i)) continue;
            const m = state.cand[i];
            if ((m & bit(X)) && (m & bit(Z))) pincersX.push(i);
            if ((m & bit(Y)) && (m & bit(Z))) pincersY.push(i);
          }
          for (const q1 of pincersX) {
            for (const q2 of pincersY) {
              if (q1 === q2) continue;
              const elims = [];
              for (const c of commonPeers(q1, q2)) {
                if (c === pivot || c === q1 || c === q2) continue;
                if (sees(c, pivot) && !state.grid[c] && (state.cand[c] & bit(Z))) elims.push({ cell: c, digit: Z });
              }
              if (elims.length) {
                return makeStep('xyz-wing', 8, {
                  eliminations: elims, focus: [pivot, q1, q2], digits: [X, Y, Z],
                  title: 'XYZ-Wing',
                  text: cellName(pivot) + ' 有候选 {' + pd.join(',') + '}，两翼 ' + cellName(q1) + '、' + cellName(q2) + ' 分别与它共享 ' + X + '、' + Y + '，并且都含 ' + Z + '。三格中必有一格取 ' + Z + '，所以同时看见三格的格子不能取 ' + Z + '。',
                });
              }
            }
          }
        }
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 9：唯一矩形（依赖“题目有唯一解”的前提）
   * --------------------------------------------------------------------- */
  function uniqueRectangle(state) {
    for (let r1 = 0; r1 < 9; r1++) {
      for (let r2 = r1 + 1; r2 < 9; r2++) {
        for (let c1 = 0; c1 < 9; c1++) {
          for (let c2 = c1 + 1; c2 < 9; c2++) {
            const cells = [r1 * 9 + c1, r1 * 9 + c2, r2 * 9 + c1, r2 * 9 + c2];
            if (cells.some((c) => state.grid[c])) continue;
            const boxes = new Set(cells.map((c) => UNIT_OF[c].box));
            if (boxes.size !== 2) continue;
            const two = cells.filter((c) => POP[state.cand[c]] === 2);
            if (two.length !== 3) continue;
            const mask = state.cand[two[0]];
            if (two.some((c) => state.cand[c] !== mask)) continue;
            const extraCell = cells.find((c) => two.indexOf(c) < 0);
            if ((state.cand[extraCell] & mask) !== mask) continue;
            const pair = bitsOf(mask);
            const elims = pair.map((d) => ({ cell: extraCell, digit: d }));
            return makeStep('unique-rectangle', 9, {
              eliminations: elims, focus: cells.slice(), digits: pair.slice(),
              title: '唯一矩形（类型 1）',
              text: '四个格子 ' + cells.map(cellName).join('、') + ' 组成矩形，落在两个宫里。其中三格候选都是 {' + pair.join(',') + '}，只有 ' + cellName(extraCell) + ' 多了别的候选。如果它也取 ' + pair.join(' 或 ') + '，这四格就能互换 ' + pair.join('/') + ' 得到第二个解，与题目唯一解矛盾。所以 ' + cellName(extraCell) + ' 只能是那个多出来的数字。',
            });
          }
        }
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 10：单数染色
   * --------------------------------------------------------------------- */
  function simpleColoring(state) {
    for (const d of DIGITS) {
      const adj = {};
      for (let i = 0; i < 81; i++) adj[i] = [];
      for (const unit of UNITS) {
        const pos = unit.cells.filter((c) => !state.grid[c] && (state.cand[c] & bit(d)));
        if (pos.length === 2) {
          adj[pos[0]].push(pos[1]);
          adj[pos[1]].push(pos[0]);
        }
      }
      const color = new Int8Array(81).fill(-1);
      for (let start = 0; start < 81; start++) {
        if (color[start] !== -1 || !adj[start].length) continue;
        const comp = [];
        const queue = [start];
        color[start] = 0;
        let bad = false;
        while (queue.length) {
          const cur = queue.shift();
          comp.push(cur);
          for (const nb of adj[cur]) {
            if (color[nb] === -1) { color[nb] = 1 - color[cur]; queue.push(nb); }
            else if (color[nb] === color[cur]) bad = true;
          }
        }
        if (bad) continue;
        // 规则 1：同色两格互相看见 → 该颜色全假
        for (let i = 0; i < comp.length; i++) {
          for (let j = i + 1; j < comp.length; j++) {
            const a = comp[i], b = comp[j];
            if (color[a] === color[b] && sees(a, b)) {
              const cls = color[a];
              const elims = comp.filter((c) => color[c] === cls).map((c) => ({ cell: c, digit: d }));
              return makeStep('coloring', 10, {
                eliminations: elims, focus: comp.slice(), digits: [d],
                title: '单数染色',
                text: '把数字 ' + d + ' 的共轭对交替染成两色。' + cellName(a) + ' 和 ' + cellName(b) + ' 同为一种颜色，却互相看得见。同色格子不可能同时为真，这一色全部排除 ' + d + '。',
              });
            }
          }
        }
        // 规则 2：某格同时看见两种颜色 → 该格排除 d
        for (let c = 0; c < 81; c++) {
          if (state.grid[c] || !(state.cand[c] & bit(d)) || color[c] !== -1) continue;
          let sees0 = false, sees1 = false;
          for (const other of comp) {
            if (!sees(c, other)) continue;
            if (color[other] === 0) sees0 = true; else sees1 = true;
          }
          if (sees0 && sees1) {
            return makeStep('coloring', 10, {
              eliminations: [{ cell: c, digit: d }], focus: comp.slice(), digits: [d],
              title: '单数染色',
              text: '数字 ' + d + ' 的两色里必有一色为真。' + cellName(c) + ' 同时看得见两种颜色的格子，无论哪一色成立它都不能取 ' + d + '。',
            });
          }
        }
      }
    }
    return null;
  }

  /* -----------------------------------------------------------------------
   * 技巧 11：交替推理链 AIC
   * --------------------------------------------------------------------- */
  function aic(state) {
    const nodeId = (cell, digit) => cell * 10 + digit;
    const cellOf = (id) => Math.floor(id / 10);
    const digitOf = (id) => id % 10;

    function strongNeighbors(id) {
      const cell = cellOf(id), d = digitOf(id);
      const out = [];
      if (POP[state.cand[cell]] === 2) {
        const other = state.cand[cell] & ~bit(d);
        if (other) out.push(nodeId(cell, lowestDigit(other)));
      }
      for (const unit of UNITS) {
        if (unit.cells.indexOf(cell) < 0) continue;
        const pos = unit.cells.filter((c) => !state.grid[c] && (state.cand[c] & bit(d)));
        if (pos.length === 2) {
          const other = pos[0] === cell ? pos[1] : pos[0];
          out.push(nodeId(other, d));
        }
      }
      return out;
    }
    function weakNeighbors(id) {
      const cell = cellOf(id), d = digitOf(id);
      const out = [];
      for (const dd of bitsOf(state.cand[cell])) if (dd !== d) out.push(nodeId(cell, dd));
      for (const unit of UNITS) {
        if (unit.cells.indexOf(cell) < 0) continue;
        for (const c of unit.cells) {
          if (c !== cell && !state.grid[c] && (state.cand[c] & bit(d))) out.push(nodeId(c, d));
        }
      }
      return out;
    }

    const starts = [];
    for (let c = 0; c < 81; c++) {
      if (state.grid[c]) continue;
      for (const d of bitsOf(state.cand[c])) {
        const id = nodeId(c, d);
        if (strongNeighbors(id).length) starts.push(id);
      }
    }
    if (starts.length > 160) starts.length = 160; // 控制搜索规模

    let result = null;
    const targetsOf = (a, b) => {
      const ca = cellOf(a), cb = cellOf(b);
      const da = digitOf(a), db = digitOf(b);
      if (ca === cb && da !== db) {
        const others = bitsOf(state.cand[ca] & ~(bit(da) | bit(db)));
        return others.map((d) => ({ cell: ca, digit: d }));
      }
      if (da !== db) return [];
      const out = [];
      for (const c of commonPeers(ca, cb)) {
        if (c === ca || c === cb) continue;
        if (!state.grid[c] && (state.cand[c] & bit(da))) out.push({ cell: c, digit: da });
      }
      return out;
    };

    for (const start of starts) {
      if (result) break;
      const visited = new Set([start]);
      const path = [start];
      const dfs = (cur, depth, nextType) => {
        if (result || depth >= 9) return;
        const nbrs = nextType === 'strong' ? strongNeighbors(cur) : weakNeighbors(cur);
        for (const nb of nbrs) {
          if (visited.has(nb)) continue;
          visited.add(nb); path.push(nb);
          const links = depth + 1;
          if (nextType === 'strong' && links >= 3) {
            const elims = targetsOf(start, nb);
            if (elims.length) {
              const a = cellOf(start), b = cellOf(nb);
              result = makeStep('aic', 11, {
                eliminations: elims, focus: path.map(cellOf), digits: [digitOf(start)],
                title: '交替推理链（AIC）',
                text: '从 ' + cellName(a) + ' 的候选 ' + digitOf(start) + ' 出发，沿强链、弱链交替走到 ' + cellName(b) + '，链条两端都是强链。两端至少有一个为真，所以同时看见两端的格子不能取 ' + digitOf(start) + '。',
              });
              return;
            }
          }
          dfs(nb, links, nextType === 'strong' ? 'weak' : 'strong');
          path.pop(); visited.delete(nb);
        }
      };
      dfs(start, 0, 'strong');
    }
    return result;
  }

  const TECHNIQUES = [
    { id: 'naked-single', level: 1, name: '唯一余数', family: '基础', fn: nakedSingle },
    { id: 'hidden-single', level: 2, name: '隐性唯一', family: '基础', fn: hiddenSingle },
    { id: 'locked-candidates', level: 3, name: '区块排除', family: '进阶', fn: lockedCandidates },
    { id: 'naked-subset', level: 4, name: '显性数组', family: '进阶', fn: nakedSubsets },
    { id: 'hidden-subset', level: 5, name: '隐性数组', family: '进阶', fn: hiddenSubsets },
    { id: 'x-wing', level: 6, name: 'X-Wing', family: '进阶', fn: xWing },
    { id: 'swordfish', level: 7, name: 'Swordfish', family: '高难', fn: (s) => fish(s, 3, 'swordfish', 'Swordfish（剑鱼）') },
    { id: 'jellyfish', level: 8, name: 'Jellyfish', family: '高难', fn: (s) => fish(s, 4, 'jellyfish', 'Jellyfish（水母）') },
    { id: 'xy-wing', level: 9, name: 'XY-Wing', family: '高难', fn: xyWing },
    { id: 'xyz-wing', level: 9, name: 'XYZ-Wing', family: '高难', fn: xyzWing },
    { id: 'unique-rectangle', level: 10, name: '唯一矩形', family: '高难', fn: uniqueRectangle },
    { id: 'coloring', level: 11, name: '单数染色', family: '高难', fn: simpleColoring },
    { id: 'aic', level: 12, name: '交替推理链', family: '高难', fn: aic },
  ];

  function findStep(state, maxLevel) {
    if (maxLevel === undefined) maxLevel = 99;
    for (const t of TECHNIQUES) {
      if (t.level > maxLevel) continue;
      const step = t.fn(state);
      if (step) return step;
    }
    return null;
  }

  function solveLog(grid, maxLevel) {
    const state = initialState(grid);
    const steps = [];
    let guard = 0;
    while (!isSolved(state.grid)) {
      if (guard++ > 400) return { solved: false, steps, reason: '步数上限' };
      const step = findStep(state, maxLevel === undefined ? 99 : maxLevel);
      if (!step) return { solved: false, steps, reason: '技巧库已用尽', state };
      applyStep(state, step);
      steps.push(step);
      if (isSolved(state.grid) || steps.length > 300) break;
    }
    // 可能还有空格但候选全空
    return { solved: isSolved(state.grid), steps, state };
  }

  /* -----------------------------------------------------------------------
   * 回溯求解：位运算 + MRV
   * --------------------------------------------------------------------- */
  function pickCell(state) {
    let best = -1, bestCount = 10;
    for (let i = 0; i < 81; i++) {
      if (state.grid[i]) continue;
      const pc = POP[state.cand[i]];
      if (pc === 0) return -2;
      if (pc < bestCount) { bestCount = pc; best = i; if (pc === 1) break; }
    }
    return best;
  }

  function search(state, limit, counter) {
    // 先做裸单与隐性唯一传播
    let dirty = true;
    while (dirty) {
      dirty = false;
      for (let i = 0; i < 81; i++) {
        if (!state.grid[i] && POP[state.cand[i]] === 1) {
          const d = lowestDigit(state.cand[i]);
          state.grid[i] = d; state.cand[i] = 0;
          for (const p of PEERS[i]) state.cand[p] &= ~bit(d);
          dirty = true;
        }
      }
      for (const unit of UNITS) {
        for (const d of DIGITS) {
          let has = false, pos = -1, count = 0;
          for (const c of unit.cells) {
            if (state.grid[c] === d) { has = true; break; }
            if (!state.grid[c] && (state.cand[c] & bit(d))) { count++; pos = c; }
          }
          if (!has && count === 1 && state.grid[pos] === 0) {
            state.grid[pos] = d; state.cand[pos] = 0;
            for (const p of PEERS[pos]) state.cand[p] &= ~bit(d);
            dirty = true;
          }
        }
      }
    }
    const cell = pickCell(state);
    if (cell === -2) return false;
    if (cell === -1) {
      counter.count++;
      if (limit && counter.count >= limit) return true;
      return false;
    }
    for (const d of bitsOf(state.cand[cell])) {
      const next = { grid: cloneGrid(state.grid), cand: new Uint16Array(state.cand) };
      next.grid[cell] = d; next.cand[cell] = 0;
      for (const p of PEERS[cell]) next.cand[p] &= ~bit(d);
      const stop = search(next, limit, counter);
      if (stop) return true;
    }
    return false;
  }

  function countSolutions(grid, limit) {
    limit = limit || 2;
    const state = initialState(grid);
    if (!isValid(state.grid)) return 0;
    const counter = { count: 0 };
    search(state, limit, counter);
    return counter.count;
  }

  function solve(grid) {
    const state = initialState(grid);
    if (!isValid(state.grid)) return null;
    return solveFirst(grid);
  }

  function solveFirst(grid) {
    const st = initialState(grid);
    if (!isValid(st.grid)) return null;
    // 传播 + 递归，直接返回第一个解
    function propagate(s) {
      let dirty = true;
      while (dirty) {
        dirty = false;
        for (let i = 0; i < 81; i++) {
          if (!s.grid[i] && POP[s.cand[i]] === 1) {
            const d = lowestDigit(s.cand[i]);
            s.grid[i] = d; s.cand[i] = 0;
            for (const p of PEERS[i]) s.cand[p] &= ~bit(d);
            dirty = true;
          }
        }
        for (const unit of UNITS) {
          for (const d of DIGITS) {
            let has = false, pos = -1, count = 0;
            for (const c of unit.cells) {
              if (s.grid[c] === d) { has = true; break; }
              if (!s.grid[c] && (s.cand[c] & bit(d))) { count++; pos = c; }
            }
            if (!has && count === 1 && s.grid[pos] === 0) {
              s.grid[pos] = d; s.cand[pos] = 0;
              for (const p of PEERS[pos]) s.cand[p] &= ~bit(d);
              dirty = true;
            }
          }
        }
      }
    }
    function rec(s) {
      propagate(s);
      let cell = -1, best = 10;
      for (let i = 0; i < 81; i++) {
        if (s.grid[i]) continue;
        const pc = POP[s.cand[i]];
        if (pc === 0) return null;
        if (pc < best) { best = pc; cell = i; if (pc === 1) break; }
      }
      if (cell === -1) return cloneGrid(s.grid);
      for (const d of bitsOf(s.cand[cell])) {
        const next = { grid: cloneGrid(s.grid), cand: new Uint16Array(s.cand) };
        next.grid[cell] = d; next.cand[cell] = 0;
        for (const p of PEERS[cell]) next.cand[p] &= ~bit(d);
        const res = rec(next);
        if (res) return res;
      }
      return null;
    }
    return rec(st);
  }

  /* -----------------------------------------------------------------------
   * 生成：随机终盘 + 挖洞，挖洞过程中保持唯一解
   * --------------------------------------------------------------------- */
  const BASE_GRID = parse(
    '123456789' +
    '456789123' +
    '789123456' +
    '234567891' +
    '567891234' +
    '891234567' +
    '345678912' +
    '678912345' +
    '912345678'
  );

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function randomFullGrid() {
    const digitMap = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    const rowsInBand = [0, 1, 2].map(() => shuffle([0, 1, 2]));
    const bands = shuffle([0, 1, 2]);
    const colsInStack = [0, 1, 2].map(() => shuffle([0, 1, 2]));
    const stacks = shuffle([0, 1, 2]);
    const transpose = Math.random() < 0.5;
    const g = new Uint8Array(81);
    for (let outR = 0; outR < 9; outR++) {
      for (let outC = 0; outC < 9; outC++) {
        const br = Math.floor(outR / 3), ir = outR % 3;
        const bc = Math.floor(outC / 3), ic = outC % 3;
        const r = bands[br] * 3 + rowsInBand[bands[br]][ir];
        const c = stacks[bc] * 3 + colsInStack[stacks[bc]][ic];
        const src = transpose ? BASE_GRID[c * 9 + r] : BASE_GRID[r * 9 + c];
        g[outR * 9 + outC] = digitMap[src - 1];
      }
    }
    return g;
  }

  function transform(grid) {
    // 数字置换 + 几何变换，保持题目结构与难度
    const digitMap = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    const rowsInBand = [0, 1, 2].map(() => shuffle([0, 1, 2]));
    const bands = shuffle([0, 1, 2]);
    const colsInStack = [0, 1, 2].map(() => shuffle([0, 1, 2]));
    const stacks = shuffle([0, 1, 2]);
    const transpose = Math.random() < 0.5;
    const out = new Uint8Array(81);
    for (let outR = 0; outR < 9; outR++) {
      for (let outC = 0; outC < 9; outC++) {
        const br = Math.floor(outR / 3), ir = outR % 3;
        const bc = Math.floor(outC / 3), ic = outC % 3;
        const r = bands[br] * 3 + rowsInBand[bands[br]][ir];
        const c = stacks[bc] * 3 + colsInStack[stacks[bc]][ic];
        const v = transpose ? grid[c * 9 + r] : grid[r * 9 + c];
        out[outR * 9 + outC] = v ? digitMap[v - 1] : 0;
      }
    }
    return out;
  }

  function digHoles(solution, targetClues, seedRng) {
    const puzzle = cloneGrid(solution);
    const order = shuffle(Array.from({ length: 81 }, (_, i) => i));
    let clues = 81;
    for (const idx of order) {
      if (clues <= targetClues) break;
      if (!puzzle[idx]) continue;
      const backup = puzzle[idx];
      puzzle[idx] = 0;
      const count = countSolutions(puzzle, 2);
      if (count !== 1) puzzle[idx] = backup;
      else clues--;
    }
    return puzzle;
  }

  const DIFFICULTY_BANDS = {
    starter: { label: '入门', maxLevel: 2, clues: 40 },
    easy: { label: '简单', maxLevel: 4, clues: 34 },
    medium: { label: '中等', maxLevel: 6, clues: 30 },
    hard: { label: '困难', maxLevel: 9, clues: 25 },
    expert: { label: '专家', maxLevel: 99, clues: 22 },
  };

  function levelLabel(maxLevel) {
    if (maxLevel <= 2) return '入门';
    if (maxLevel <= 4) return '简单';
    if (maxLevel <= 6) return '中等';
    if (maxLevel <= 9) return '困难';
    return '专家';
  }

  function rate(grid) {
    const started = Date.now();
    // 难度 = 解出这道题所需的最低技巧层级，而不是“过程中碰巧出现过的最难技巧”。
    // 对 L=1..12 依次限权求解，第一次成功的那一层就是这道题的下限。
    let log = null, level = 99;
    for (let L = 1; L <= 12; L++) {
      log = solveLog(grid, L);
      if (log.solved) { level = L; break; }
    }
    let maxLevel = 0;
    const used = {};
    if (log) {
      for (const s of log.steps) {
        if (s.level > maxLevel) maxLevel = s.level;
        used[s.tech] = (used[s.tech] || 0) + 1;
      }
    }
    let clues = 0;
    for (let i = 0; i < 81; i++) if (grid[i]) clues++;
    return {
      solved: level !== 99,
      level,
      label: level === 99 ? '未定' : levelLabel(level),
      clues,
      steps: log ? log.steps.length : 0,
      techniques: used,
      ms: Date.now() - started,
    };
  }

  function generate(difficulty, opts) {
    opts = opts || {};
    const band = DIFFICULTY_BANDS[difficulty] || DIFFICULTY_BANDS.medium;
    const attempts = opts.attempts || 12;
    let best = null;
    for (let attempt = 0; attempt < attempts; attempt++) {
      const solution = randomFullGrid();
      const puzzle = digHoles(solution, band.clues);
      const r = rate(puzzle);
      // 优先保留技巧库内可解出的题；只有在所有尝试都超出技巧库时才退回未解题。
      if (r.solved) {
        if (!best || !best.rate.solved || r.level > best.rate.level) {
          best = { puzzle, solution, rate: r };
        }
      } else if (!best) {
        best = { puzzle, solution, rate: r };
      }
      if (r.solved && r.label === band.label) {
        return { puzzle, solution, rate: r, attempts: attempt + 1 };
      }
    }
    return { puzzle: best.puzzle, solution: best.solution, rate: best.rate, attempts };
  }

  function difficultyOfPuzzle(grid) { return rate(grid); }

  /* -----------------------------------------------------------------------
   * 导出
   * --------------------------------------------------------------------- */
  return {
    ALL, bit, POP, DIGITS,
    ROWS, COLS, BOXES, UNITS, PEERS, UNIT_OF,
    parse, format, cloneGrid, candidates, initialState, isSolved, isValid,
    applyStep, findStep, solveLog, solve, solveFirst, countSolutions,
    TECHNIQUES, rate, levelLabel, generate, randomFullGrid, transform, digHoles,
    cellName, unitName, unitTypeName, sees, bitsOf,
    DIFFICULTY_BANDS,
  };
});

<h2>81 格，27 个单元</h2>
<p>标准数独是一个 9×9 的方阵，共 81 格。横向 9 格叫一行，纵向 9 格叫一列。粗线把盘面切成 9 个 3×3 的小方块，每个叫一宫。</p>
<p>行、列、宫合起来叫单元。盘面有 9 行、9 列、9 宫，一共 27 个单元。每个单元都是 9 格，不多不少。</p>

<p>本书用 R4C5 表示第 4 行第 5 列。行号从上往下 1–9，列号从左往右 1–9。顺序反了会找不到格子，写笔记时也会对不上。</p>
<p>宫按从左到右、从上到下编号 B1–B9。R4C5 落在第 5 宫。三个宫横着排成一带（band），竖着排成一栈（stack）；这两个词在第 8 章讲 X-Wing 时会反复出现。</p>
<div class="mini-board" data-board="900040817870090645040071039060708920700930064309000001654107002293654170180329056" data-hl="40" data-shade="row:4,col:4,box:4" data-caption="R5C5 同时属于第 5 行、第 5 列和第 5 宫。填一个数字，三个单元一起受限。"></div>

<h2>三条约束</h2>
<p>把第 r 行第 c 列的数字记作 g(r,c)。合法的条件是下面三组集合都等于 {1,2,3,4,5,6,7,8,9}：</p>
<ul>
  <li>每一行：g(r,1) 到 g(r,9)；</li>
  <li>每一列：g(1,c) 到 g(9,c)；</li>
  <li>每一宫：该宫 9 格的数字。</li>
</ul>
<p>等价的说法是：同一行、同一列、同一宫里不能出现两个相同的数字。这也是检查盘面最常用的方法。</p>

<h2>三个词要分开</h2>
<p><b>填满</b>：81 格都有数字。<b>合法</b>：没有行列宫重复。<b>解</b>：填满且合法。题目还可能有多解或无解，所以出题时要额外保证<b>唯一解</b>。</p>
<p>填满不等于做对。下面这一行有两个 9，其他地方再漂亮也不合法。</p>
<div class="mini-board" data-board="919000820060000004000049007000001050000530048653080100506924000490300000031000492" data-conflict="1" data-hl="0,2" data-caption="R1C1 和 R1C3 都是 9：同一行重复，同一宫也重复。这个盘面不合法。"></div>

<p>n 阶拉丁方是 n×n 的方阵，每行、每列都恰好含 1 到 n 一次。9 阶拉丁方有 81 格，行和列都合法，但它不管 3×3 宫。</p>

<h2>候选数是什么</h2>
<p>一个空格的候选数，就是它当前还可能填的数字。算法很直接：把这个格所在行、所在列、所在宫已经出现的数字全部划掉，剩下的就是候选。</p>
<p>候选不是猜出来的，也不是“感觉哪个更像”。它是规则已经排除之后剩下的确定集合。一个候选被划掉，意味着填它一定会造成重复。</p>

<h2>一个例子</h2>
<p>假设 R7C3 的同行已经有 1、2、3、5、6、8、9，同列有 4、7，同宫有 2、6。合起来 1–9 里只剩 4 没出现。R7C3 的候选就是 {4}，填 4。</p>

<p>同一单元里，两个格子的候选并集恰好是 {a,b}，而且每格最多两个候选。这两个格子必须把 a、b 各占一次，所以同单元其他格子不能再放 a 或 b。</p>

<h2>显性三数组</h2>
<p>三个格子的候选并集恰好是三个数字，且每格候选不超过三个。这三个格子占掉这三个数字，同单元其他格子删掉它们。三数组比数对难找，因为组合更多，但只要盯住“并集大小等于格子数”这一条，就不会误判。</p>

<h2>结构</h2>
<p>选一个数字 d。找两行，它们里面 d 的候选都恰好只剩两个位置，而且这两行留下的列完全相同。四个交点构成一个矩形，这就是 X-Wing。</p>
<div class="schematic" data-kind="xwing"></div>
<p>上图里，第 2 行和第 6 行的 d 都只能落在第 2 列和第 8 列。四个角都有 d 的候选。</p>

<h2>为什么能删</h2>
<p>第 2 行必须有一个 d，只能在这两列之一；第 6 行也必须有一个 d，也只能在这两列之一。两行不能把 d 放在同一列（同一列只能有一个 d），所以它们正好一列一个，把这两列都占掉。</p>

<h2>识别时的两个条件</h2>
<p>第一，两行里 d 的候选数都必须正好是 2。第二，这两组候选所在的列必须完全相同。少一个条件都不是 X-Wing。</p>

<h2>Swordfish：3 行 3 列</h2>
<p>选一个数字 d。找三行，它们里面 d 的候选都落在同样的三列以内，而且每行至少有两个候选位置。这三行各需要一个 d，三个 d 落在三列里，每列最多一个，所以三列恰好各占一个。</p>
<div class="schematic" data-kind="swordfish"></div>
<p>这三列的 d 已经被这三行用完，其他行在这三列就不能再放 d。删掉这些候选。</p>

<h2>Jellyfish：4 行 4 列</h2>
<p>同样的结构放大到四行四列。四行各需要一个 d，四个 d 占满四列，其他行在这四列删 d。Jellyfish 在实际题目里比 Swordfish 少见，因为四行都保持稀疏候选的机会不多。</p>

<h2>一张统一的表</h2>

    <tr><td>Jellyfish</td><td>4 行</td><td>4 列</td><td>这四列其他行的 d</td></tr>
  </tbody>

<p>把行换成列，全部成立。做题时先数“有几行里 d 的候选很少”，再看这些候选落在几列。列数等于行数，结构就成立。</p>

<h2>成立的条件</h2>
<p>第一，所选的行里，每行 d 的候选数在 2 到 n 之间。只有一个位置的行是隐性唯一，直接填就行，不必当鱼。超过 n 个位置的行不能选，因为它可能把 d 放到交叉线之外。</p>
<p>第二，所有候选所在的列，并集必须正好是 n 列。少了不够占，多了锁不住。</p>

    body: `
<p class="lead">前面所有技巧都只用到“每行每列每宫各一次”。唯一矩形多用一个前提：这道题只有一个解。用得好能省很多步，用错前提会直接做错。</p>

<h2>死锁模式</h2>
<p>看两行、两列交叉出的四个格子。如果四格的候选都恰好是 {a,b}，而且四格落在两个宫里，那么把 a、b 在四格里互换，仍然满足所有行、列、宫约束。原盘有一个解，互换后就得到第二个解。</p>
<div class="schematic" data-kind="ur"></div>
<p>这种结构叫死锁模式（deadly pattern）。标准数独题通常保证唯一解，所以死锁模式不可能出现在正确盘面里。</p>

<h2>类型 1</h2>
<p>四个格子里，三格的候选恰好是 {a,b}，第四格是 {a,b,c}。如果第四格取 a 或 b，这四格就变成完整的死锁模式，题目出现两个解。与唯一解矛盾，所以第四格只能取 c，a、b 从它的候选里删掉。</p>
<p>四个条件要同时满足：两行、两列、恰好两个宫、三格候选恰好 {a,b}。少一个都不成立。</p>

<h2>为什么必须是两个宫</h2>
<p>如果四格落在四个不同的宫，互换 a、b 会改变每个宫里 a、b 的分布。宫约束要求每个宫各含 a、b 一次，互换后可能变成重复或缺失，死锁就不成立。</p>
<p>如果四格落在同一个宫，{a,b} 会在同一个宫里出现两次，本来就非法，根本轮不到互换。</p>

<h2>使用边界</h2>
<p>唯一矩形只在“题目保证唯一解”时成立。自己出的题如果没校验唯一性，或者题目本身多解，这个技巧会删掉合法解。做题前先确认题目来源，竞赛和正规出版物一般没问题。</p>

<p>先固定结构：取两行 r1、r2 和两列 c1、c2，四个格子是 A=(r1,c1)、B=(r1,c2)、C=(r2,c1)、D=(r2,c2)。假设四格都只含候选 a、b。</p>

<h2>XY-Wing 的结构</h2>
<p>找三个双值格：枢纽 P 的候选是 {x,y}，两翼 Q1 是 {x,z}，Q2 是 {y,z}。Q1、Q2 都必须看得见 P（同行、同列或同宫）。</p>
<div class="schematic" data-kind="xywing"></div>
<p>如果 P=x，Q1 不能取 x，只能取 z；如果 P=y，Q2 不能取 y，只能取 z。P 不是 x 就是 y，所以 Q1、Q2 里至少有一个取 z。</p>
<p>任何同时看得见 Q1 和 Q2 的格子，如果取 z，就会和这个结论冲突。删掉这些格子里的 z。</p>

<h2>XYZ-Wing 的结构</h2>
<p>枢纽 P 变成三值格 {x,y,z}，两翼还是 {x,z} 和 {y,z}，都看得见 P。结论更强：P、Q1、Q2 三格中必有一格取 z。任何同时看得见这三格的格子不能取 z。</p>
<p>XYZ-Wing 的删除范围比 XY-Wing 多一个条件：目标格还要看得见枢纽。因为 z 可能由枢纽自己取到。</p>

<table>
  <thead><tr><th></th><th>枢纽</th><th>两翼</th><th>目标格要看见</th></tr></thead>
  <tbody>

    <tr><td>XYZ-Wing</td><td>{x,y,z}</td><td>{x,z}、{y,z}</td><td>枢纽和两翼</td></tr>
  </tbody>
</table>

<p>先扫所有双值格，把它们记下来。以每个双值格为枢纽，找与它共享一个候选的双值邻居。两个邻居的另一半候选如果相同，就构成 XY-Wing。再检查是否有格子同时看见两个邻居，且候选里含 z。</p>
<p>找的时候不要一开始就扫全盘。先锁定候选最少的区域，双值格通常集中在候选已经被削薄的单元里。</p>

<p class="lead">链不是猜。它把“如果这个不成立，那个就必须成立”写成一条可以检查的推理线。学会这一章，专家题才有解。</p>

<h2>两种链</h2>
<p><b>强链</b>：两个候选至少有一个为真。写作 A ⇒ B。来源有两种：同一单元里某个数字只剩两个位置（共轭对）；同一个双值格的两个候选。</p>
<p><b>弱链</b>：两个候选至多有一个为真。写作 A ⇢ B。来源：同一单元里同一数字的任意两个候选；同一个格子里任意两个不同候选。</p>
<p>强链和弱链不是“程度”，是两种不同的真假约束。强链允许两个都真吗？不允许，因为两个候选在同一单元同一数字，或同一格不同数字，最多一个真。所以强链其实同时是弱链，但弱链不一定是强链。</p>

<h2>单数染色</h2>
<p>只盯一个数字 d。把它的共轭对连成图，交替染成黑、白两色。同一条共轭对的两端颜色相反，因为必有一真一假。</p>

<h2>AIC：交替推理链</h2>

<h2>变量与约束</h2>
<p>81 个格子，每格的取值是 1–9。约束有四类：每格一个数字；每行每个数字一次；每列每个数字一次；每宫每个数字一次。题目给的提示数就是预先固定的变量。</p>
<p>最直接的写法是回溯：选一个空格，依次试 1–9，冲突就退回。9×9 的搜索空间理论上很大，但约束传播会砍掉绝大部分分支。</p>

<h2>位掩码与传播</h2>
<p>每个格子的候选用一个 9 位整数表示，第 d 位为 1 表示 d 还可填。填下一个数字后，把它从同行、同列、同宫所有格子的掩码里清掉。某个格子的掩码只剩一位时，直接落子，这叫裸单传播。</p>
<p>再扫一遍单元，如果某个数字在一个单元里只剩一个位置，也可以直接落子。两个传播交替做，很多题在搜索开始前就被削平了。</p>

<h2>MRV：先挑最窄的路</h2>
<p>回溯时不要按格子顺序试。先选候选最少的空格，这样分支数最少。这个启发式叫 MRV（Minimum Remaining Values）。同样的搜索，配上 MRV，节点数会差一个数量级。</p>

<pre class="code"><code>function dfs(g, c) {
  let cell = -1, best = 10;
  for (let i = 0; i &lt; 81; i++) {
    if (g[i]) continue;
    const n = popcount(c[i]);
    if (n === 0) return null;          // 候选空，分支死了
    if (n &lt; best) { best = n; cell = i; }
  }
  if (cell === -1) return g;          // 填满，返回解
  for (const d of digitsOf(c[cell])) {
    const ng = g.slice(), nc = c.slice();
    ng[cell] = d;
    for (const p of peers[cell]) nc[p] &amp;= ~bit(d);
    const res = dfs(ng, nc);
    if (res) return res;
  }
  return null;
}</code></pre>
